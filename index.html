<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Arena</title>
    <style>
        canvas {
            display: block;
            margin: 0 auto;
        }
        #controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 20px;
            margin: 5px auto;
            max-width: 800px;
            font-family: Arial, sans-serif;
        }
        .control-group {
            display: flex;
            align-items: center;
        }
        .control-group span {
            color: #666;
            margin-right: 8px;
            font-size: 12px;
            white-space: nowrap;
        }
        .floor-group, .pod-group {
            display: flex;
            gap: 4px;
        }
        button {
            padding: 4px 8px;
            font-size: 11px;
            background: #2a2a4e;
            color: #fff;
            border: 1px solid #00ff88;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        button:hover {
            background: #3a3a6e;
            transform: translateY(-1px);
        }
        button.active {
            background: #3a3a6e;
            border-color: #ff8800;
        }
        .pod-group button {
            border-color: #ff4488;
        }
        .pod-group button.active {
            border-color: #ff8800;
            box-shadow: 0 0 5px rgba(255, 136, 0, 0.5);
        }
        .floor-group button {
            border-color: #44ff88;
        }
        .floor-group button.active {
            border-color: #88ff00;
            box-shadow: 0 0 5px rgba(136, 255, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="controls">
        <div class="control-group">
            <span>Floor:</span>
            <div class="floor-group">
                <button id="metalFloor" class="active">Metal</button>
                <button id="sandDunes">Sand</button>
                <button id="denseSand">Dense</button>
            </div>
        </div>
        <div class="control-group">
            <span>Pod Type:</span>
            <div class="pod-group">
                <button id="defaultPod">Default</button>
                <button id="speedPod">Speed</button>
                <button id="heavyPod">Heavy</button>
                <button id="agilePod" class="active">Agile</button>
            </div>
        </div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script type="module">
        // Wait for DOM to be fully loaded before initializing
        document.addEventListener('DOMContentLoaded', () => {
            import('./game/init.js').then(module => {
                const canvas = document.getElementById('gameCanvas');
                const game = new module.GameInitializer(canvas);
                game.start();
            });
        });
    </script>
</body>
</html>
